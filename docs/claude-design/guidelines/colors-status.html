<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-page)}.w{padding:20px 24px;font-family:var(--font-ui)}.row{display:flex;gap:14px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:100%;height:56px;border-radius:var(--radius-sm);border:1px solid var(--border)}.n{font-size:12px;font-weight:600;color:var(--text-strong);letter-spacing:.01em}.h{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.u{font-size:11px;color:var(--text-muted);max-width:150px;line-height:1.4}</style></head><body><div class="w"><div style="display:flex;flex-wrap:wrap;gap:10px"><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#EEE4D1;color:#6A5C45;font-size:12px;font-weight:600;border:1px solid #6A5C452e"><span style="width:6px;height:6px;border-radius:50%;background:#6A5C45"></span>Draft</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#E2EDF0;color:#2C5B6B;font-size:12px;font-weight:600;border:1px solid #2C5B6B2e"><span style="width:6px;height:6px;border-radius:50%;background:#2C5B6B"></span>Awaiting confirmation</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#FAEBD6;color:#CE8A39;font-size:12px;font-weight:600;border:1px solid #CE8A392e"><span style="width:6px;height:6px;border-radius:50%;background:#CE8A39"></span>Payment pending</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#E4F0E9;color:#2F7D5D;font-size:12px;font-weight:600;border:1px solid #2F7D5D2e"><span style="width:6px;height:6px;border-radius:50%;background:#2F7D5D"></span>Paid</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#E2EDF0;color:#2C5B6B;font-size:12px;font-weight:600;border:1px solid #2C5B6B2e"><span style="width:6px;height:6px;border-radius:50%;background:#2C5B6B"></span>Processing</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#F8E5D8;color:#A44819;font-size:12px;font-weight:600;border:1px solid #A448192e"><span style="width:6px;height:6px;border-radius:50%;background:#A44819"></span>In transit</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#D5E6DC;color:#2A5C3E;font-size:12px;font-weight:600;border:1px solid #2A5C3E2e"><span style="width:6px;height:6px;border-radius:50%;background:#2A5C3E"></span>Delivered</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#D5E6DC;color:#2A5C3E;font-size:12px;font-weight:600;border:1px solid #2A5C3E2e"><span style="width:6px;height:6px;border-radius:50%;background:#2A5C3E"></span>Completed</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#EEE4D1;color:#8E7F63;font-size:12px;font-weight:600;border:1px solid #8E7F632e"><span style="width:6px;height:6px;border-radius:50%;background:#8E7F63"></span>Cancelled</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#EEE4D1;color:#6A5C45;font-size:12px;font-weight:600;border:1px solid #6A5C452e"><span style="width:6px;height:6px;border-radius:50%;background:#6A5C45"></span>Refunded</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#F7E1DC;color:#9E2A1B;font-size:12px;font-weight:600;border:1px solid #9E2A1B2e"><span style="width:6px;height:6px;border-radius:50%;background:#9E2A1B"></span>Disputed</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#E2EDF0;color:#2C5B6B;font-size:12px;font-weight:600;border:1px solid #2C5B6B2e"><span style="width:6px;height:6px;border-radius:50%;background:#2C5B6B"></span>Under review</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#FAEBD6;color:#CE8A39;font-size:12px;font-weight:600;border:1px solid #CE8A392e"><span style="width:6px;height:6px;border-radius:50%;background:#CE8A39"></span>More info required</span><span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-pill);background:#F7E1DC;color:#9E2A1B;font-size:12px;font-weight:600;border:1px solid #9E2A1B2e"><span style="width:6px;height:6px;border-radius:50%;background:#9E2A1B"></span>Suspended</span></div></div></body></html>

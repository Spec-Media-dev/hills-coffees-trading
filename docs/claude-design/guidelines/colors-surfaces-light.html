<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--surface-page)}.w{padding:20px 24px;font-family:var(--font-ui)}.row{display:flex;gap:14px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{width:100%;height:56px;border-radius:var(--radius-sm);border:1px solid var(--border)}.n{font-size:12px;font-weight:600;color:var(--text-strong);letter-spacing:.01em}.h{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.u{font-size:11px;color:var(--text-muted);max-width:150px;line-height:1.4}</style></head><body><div class="w"><div class="row"><div class="sw" style="flex:1;min-width:120px"><div class="chip" style="background:#EEE4D1"></div><div class="n">--bg</div><div class="h">#EEE4D1</div></div><div class="sw" style="flex:1;min-width:120px"><div class="chip" style="background:#F7F1E6"></div><div class="n">--surface-page</div><div class="h">#F7F1E6</div></div><div class="sw" style="flex:1;min-width:120px"><div class="chip" style="background:#FFFFFF"></div><div class="n">--surface-card</div><div class="h">#FFFFFF</div></div><div class="sw" style="flex:1;min-width:120px"><div class="chip" style="background:#173C32"></div><div class="n">--primary</div><div class="h">#173C32</div></div><div class="sw" style="flex:1;min-width:120px"><div class="chip" style="background:#D7C8AD"></div><div class="n">--border</div><div class="h">#D7C8AD</div></div></div></div></body></html>

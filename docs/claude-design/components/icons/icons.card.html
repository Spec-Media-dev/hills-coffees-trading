<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>html,body{margin:0;background:var(--surface-page)}#root{padding:20px 24px}.grid{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}.lbl{font-family:var(--font-ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);font-weight:700;width:100%;margin:4px 0 2px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Icon } = window.HillsCoffeeDesignSystem_ca006d;
const names=['layout-grid','coffee','package','circle-dollar-sign','map-pin','map','sprout','warehouse','tag','file-text','book-open','image','truck','ship','clipboard-list','triangle-alert','shield-check','users','settings','bell'];
function Demo(){return (<div style={{display:'grid',gridTemplateColumns:'repeat(10,1fr)',gap:10}}>
{names.map(n=>(<div key={n} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,padding:'10px 4px',background:'var(--surface-card)',border:'1px solid var(--border)',borderRadius:10}}>
<Icon name={n} size={20} color="var(--primary)"/>
<span style={{fontFamily:'var(--font-ui)',fontSize:9,color:'var(--text-muted)',textAlign:'center',lineHeight:1.2}}>{n}</span></div>))}
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
setTimeout(()=>window.lucide&&window.lucide.createIcons({nameAttr:'data-lucide'}),60);
</script></body></html>
